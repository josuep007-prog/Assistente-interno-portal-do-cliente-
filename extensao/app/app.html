<!doctype html>
<html lang="pt-BR" class="app-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Onvio</title>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="app.css">
<script src="../tema.js"></script>
<script src="../core.js"></script>
</head>
<body class="app-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5A7 7 0 0 1 22 21"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-4.6A8 8 0 1 1 21 12Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="topo">
    <a class="marca" href="#/inicio" aria-label="Início do Control Onvio">
      <span class="logo"><img src="../logo.svg" alt=""></span>
      <span class="wm"><span class="wm-a">Control</span> <span class="wm-b">Onvio</span></span>
    </a>
    <form class="busca" id="busca" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="busca-q" placeholder="Buscar em todas as solicitações: ID, cliente, empregado ou assunto" autocomplete="off" aria-label="Buscar solicitações">
    </form>
    <span class="aovivo" id="aovivo" role="status"><span class="ponto"></span><span id="aovivo-tx">Carregando…</span></span>
    <button class="icon-btn" id="btn-atualizar" type="button" title="Atualizar agora" aria-label="Atualizar agora"><svg class="ic"><use href="#i-refresh"/></svg></button>
    <button class="icon-btn sino" id="btn-sino" type="button" title="Alertas" aria-label="Alertas" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg><span class="cont" id="sino-cont"></span></button>
    <button class="icon-btn" id="btn-tema" type="button" title="Alternar tema" aria-label="Alternar tema claro/escuro"><svg class="ic"><use href="#i-moon"/></svg></button>
    <span class="quem" id="quem"></span>
    <button class="btn-ver" id="btn-ver-onvio" type="button" title="Mostrar a tela do Onvio (o Control Onvio continua aberto por trás)"><svg class="ic"><use href="#i-eye"/></svg>Ver Onvio</button>
  </header>

  <nav class="lateral" aria-label="Seções">
    <a href="#/inicio" data-rota="inicio"><svg class="ic"><use href="#i-home"/></svg><span>Início</span></a>
    <a href="#/fila" data-rota="fila"><svg class="ic"><use href="#i-user"/></svg><span>Minha fila</span><span class="n" id="n-fila"></span></a>
    <a href="#/equipe" data-rota="equipe"><svg class="ic"><use href="#i-users"/></svg><span>Equipe</span><span class="n" id="n-equipe"></span></a>
    <a href="#/clientes" data-rota="clientes"><svg class="ic"><use href="#i-building"/></svg><span>Clientes</span></a>
    <a href="#/solicitacoes" data-rota="solicitacoes"><svg class="ic"><use href="#i-list"/></svg><span>Solicitações</span></a>
    <a href="#/lembretes" data-rota="lembretes"><svg class="ic"><use href="#i-clock"/></svg><span>Lembretes</span><span class="n" id="n-lembretes"></span></a>
    <span class="sp"></span>
    <a href="#/config" data-rota="config"><svg class="ic"><use href="#i-gear"/></svg><span>Configurações</span></a>
  </nav>

  <main class="vista" id="vista" tabindex="-1"></main>
</div>

<div class="sino-painel" id="sino-painel" hidden role="dialog" aria-label="Alertas"></div>
<div class="fundo" id="fundo" hidden></div>
<aside class="gaveta" id="gaveta" hidden role="dialog" aria-label="Solicitação"></aside>
<div class="dica" id="dica" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
