<!doctype html>
<html lang="pt-BR" class="app-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Onvio</title>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="app.css">
<script src="../tema.js"></script>
<script src="../core.js"></script>
</head>
<body class="app-body">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5A7 7 0 0 1 22 21"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-4.6A8 8 0 1 1 21 12Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  </defs>
</svg>

<div class="app">
  <!-- trilho lateral escuro (igual ao Control Hub): só ícones; abre com o nome ao passar o mouse -->
  <nav class="trilho" id="trilho" aria-label="Seções">
    <a class="trilho-marca" href="#/inicio" aria-label="Início do Control Onvio">
      <img src="../logo.svg" alt="">
      <span class="tx"><b><span class="wm-a">Control</span> <span class="wm-b">Onvio</span></b><small>Portal do Cliente · Onvio</small></span>
    </a>
    <button class="ti" type="button" id="rail-busca" style="--accent:#6BAAC9"><span class="ti-ic"><svg class="ic"><use href="#i-search"/></svg></span><span class="ti-tx">Buscar <kbd>/</kbd></span></button>
    <span class="ti-sep"></span>
    <span class="ti-rot"><i></i>Meu trabalho</span>
    <a class="ti" href="#/inicio" data-rota="inicio" style="--accent:#E8474B"><span class="ti-ic"><svg class="ic"><use href="#i-home"/></svg></span><span class="ti-tx">Hoje</span></a>
    <a class="ti" href="#/fila" data-rota="fila" style="--accent:#5FA8E0"><span class="ti-ic"><svg class="ic"><use href="#i-inbox"/></svg><span class="n" id="n-fila"></span></span><span class="ti-tx">Minha fila</span></a>
    <a class="ti" href="#/lembretes" data-rota="lembretes" style="--accent:#E3A008"><span class="ti-ic"><svg class="ic"><use href="#i-calendar"/></svg><span class="n" id="n-lembretes"></span></span><span class="ti-tx">Agenda e lembretes</span></a>
    <span class="ti-rot"><i></i>Gestão</span>
    <a class="ti" href="#/equipe" data-rota="equipe" style="--accent:#33A67C"><span class="ti-ic"><svg class="ic"><use href="#i-users"/></svg><span class="n" id="n-equipe"></span></span><span class="ti-tx">Equipe</span></a>
    <a class="ti" href="#/clientes" data-rota="clientes" style="--accent:#9478D6"><span class="ti-ic"><svg class="ic"><use href="#i-building"/></svg></span><span class="ti-tx">Clientes</span></a>
    <span class="ti-rot"><i></i>Onvio</span>
    <a class="ti" href="#/solicitacoes" data-rota="solicitacoes" style="--accent:#B98530"><span class="ti-ic"><svg class="ic"><use href="#i-list"/></svg></span><span class="ti-tx">Todas as solicitações</span></a>
    <span class="sp"></span>
    <button class="ti" type="button" id="btn-tema" style="--accent:#8FA0AD" aria-label="Alternar tema claro/escuro"><span class="ti-ic"><svg class="ic"><use href="#i-moon"/></svg></span><span class="ti-tx" id="tema-tx">Tema escuro</span></button>
    <a class="ti" href="#/config" data-rota="config" style="--accent:#8FA0AD"><span class="ti-ic"><svg class="ic"><use href="#i-gear"/></svg></span><span class="ti-tx">Configurações</span></a>
    <div class="trilho-pe" id="trilho-pe"><span class="av" id="avatar"></span><span class="tx"><b id="quem"></b></span></div>
  </nav>

  <div class="principal">
    <!-- cabeçalho do módulo (igual ao do Departamento Pessoal): título, ferramentas e abas -->
    <header class="mod-cab">
      <div class="mod-linha">
        <div class="mod-tit"><h1 id="titulo">Control Onvio</h1><span class="mod-sub" id="subtitulo"></span></div>
        <div class="mod-extra" id="cab-extra"></div>
        <button class="busca-falsa" type="button" id="btn-busca" aria-label="Buscar (/)"><svg class="ic"><use href="#i-search"/></svg><span>Buscar solicitação, cliente…</span><kbd>/</kbd></button>
        <span class="aovivo" id="aovivo" role="status"><span class="ponto"></span><span id="aovivo-tx">Carregando…</span></span>
        <button class="icon-btn" id="btn-atualizar" type="button" title="Ler o Onvio agora" aria-label="Ler o Onvio agora"><svg class="ic"><use href="#i-refresh"/></svg></button>
        <button class="icon-btn sino" id="btn-sino" type="button" title="Alertas" aria-label="Alertas" aria-expanded="false"><svg class="ic"><use href="#i-bell"/></svg><span class="cont" id="sino-cont"></span></button>
        <button class="btn btn-sm btn-ver" id="btn-ver-onvio" type="button" title="Mostrar a tela do Onvio (o Control Onvio continua aberto por trás)"><svg class="ic ic-sm"><use href="#i-eye"/></svg>Ver Onvio</button>
      </div>
      <nav class="mod-abas" id="abas" role="tablist" hidden></nav>
    </header>
    <main class="vista" id="vista" tabindex="-1"></main>
  </div>
</div>

<!-- busca em janela central (Ctrl+K ou /) -->
<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-box" role="dialog" aria-label="Buscar">
    <form class="cmdk-campo" id="busca" role="search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input type="search" id="busca-q" placeholder="ID, cliente, empregado, assunto ou tela…" autocomplete="off" aria-label="Buscar" aria-controls="cmdk-res">
      <kbd>Esc</kbd>
    </form>
    <div class="cmdk-res" id="cmdk-res" role="listbox"></div>
    <div class="cmdk-pe"><span><kbd>↑</kbd><kbd>↓</kbd> escolher</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> fechar</span></div>
  </div>
</div>

<div class="sino-painel" id="sino-painel" hidden role="dialog" aria-label="Alertas"></div>
<div class="fundo" id="fundo" hidden></div>
<section class="dlg dlg-lg" id="gaveta" hidden role="dialog" aria-modal="true" aria-label="Solicitação" tabindex="-1"></section>
<section class="dlg" id="dlg-lembrete" hidden role="dialog" aria-modal="true" aria-label="Lembrete" tabindex="-1"></section>
<div class="dica" id="dica" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
